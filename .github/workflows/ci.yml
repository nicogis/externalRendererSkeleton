name: Build and test
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Check IIS and Soldier build artifacts
        run: |
          test -s dist/index.html
          test -s dist/models/Soldier.glb
          test -s dist/web.config
