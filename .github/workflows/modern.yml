name: Modern demo CI
on:
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/modern.yml'
  push:
    branches: [feature/modern-arcgis51-threejs]
    paths:
      - 'modern/**'
      - '.github/workflows/modern.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
