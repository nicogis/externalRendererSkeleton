<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skeleton RenderNode — ArcGIS 5.1</title></head>
<body><arcgis-scene basemap="gray" ground="world-elevation"><arcgis-zoom slot="top-left"></arcgis-zoom></arcgis-scene>
<div id="controls"><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><button id="focus" type="button">Focus Soldier</button><label>Speed <input id="speed" type="range" min="0" max="8" value="1.4" step="0.1"><output id="speedValue">1.4</output> m/s</label><label>Heading <input id="heading" type="range" min="-180" max="180" value="180" step="5"><output id="headingValue">180</output>°</label><label>Foot clearance <input id="clearance" type="range" min="-0.5" max="1" value="0.1" step="0.05"><output id="clearanceValue">0.10</output> m</label><div id="status" role="status">Initializing…</div></div>
<script type="module" src="/src/main.js"></script></body></html>
