<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skeleton RenderNode — ArcGIS 5.1</title></head>
<body><arcgis-scene basemap="gray" ground="world-elevation"><arcgis-zoom slot="top-left"></arcgis-zoom></arcgis-scene>
<div id="controls"><label>Route display <select id="routeMode"><option value="progress">Completed / remaining</option><option value="reveal">Reveal as you move</option><option value="light">Thin line</option></select></label><button id="drawRoute" type="button">Draw route</button><button id="clearRoute" type="button">Clear route</button><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><button id="focus" type="button">Focus Soldier</button><label>Speed <input id="speed" type="range" min="0" max="8" value="1.4" step="0.1"><output id="speedValue">1.4</output> m/s</label><label>Heading <input id="heading" type="range" min="-180" max="180" value="180" step="5"><output id="headingValue">180</output>°</label><label>Foot clearance <input id="clearance" type="range" min="-0.5" max="1" value="0.1" step="0.05"><output id="clearanceValue">0.10</output> m</label><div id="status" role="status">Initializing…</div></div>
<details id="activityMonitor" open><summary>Activity Monitor <span class="sim-note">Simulation</span></summary><div class="metrics"><div><small>Distance</small><strong id="metricDistance">0 m</strong></div><div><small>Active time</small><strong id="metricTime">00:00:00</strong></div><div><small>Speed</small><strong id="metricSpeed">0.0 km/h</strong></div><div><small>Pace</small><strong id="metricPace">—</strong></div><div><small>Ascent</small><strong id="metricAscent">0 m</strong></div><div><small>Descent</small><strong id="metricDescent">0 m</strong></div><div><small>Calories (estimate)</small><strong id="metricCalories">0 kcal</strong></div><div><small>Heart rate</small><strong>— bpm</strong></div></div><label class="metric-weight">Weight for calorie estimate <input type="number" id="activityWeight" min="30" max="250" step="1" value="75"> kg</label><div class="meter"><div id="metricProgress" class="meter-fill"></div></div><p class="metric-disclaimer">Calories are rough MET estimates, not measurements. Heart rate requires a connected sensor; no heart rate is inferred.</p></details>
<script type="module" src="/src/main.js"></script></body></html>
